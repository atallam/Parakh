# Install once: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        exclude: ^uv\.lock$
        args: [--maxkb=1024]  # recorded source fixtures (plan 14 §4.2) reach ~600 KB
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: private-files
        name: private files (AC-F03.4)
        entry: uv run python tools/check_private_files.py
        language: system
      - id: repo-rules
        name: token and layering lint
        entry: uv run python tools/lint_rules.py
        language: system
        pass_filenames: false
        types_or: [python, yaml, toml, css, html, json]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
