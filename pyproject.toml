[project]
name = "parakh"
version = "0.1.0"
description = "Personal NSE stock-analysis framework with value and momentum lenses and Telegram alerts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "boto3>=1.34",
    "casparser>=1.4.1,<2",
    "duckdb>=1.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "langfuse>=2.50",
    "mcp>=1.9",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pandera>=0.20",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pydantic-settings>=2.4",
    "pydantic>=2.8",
    "pymupdf>=1.24",
    "pyrage>=1.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "streamlit>=1.37",
    "structlog>=24.1",
    "supabase>=2.0",
    "tenacity>=9.0",
    "tzdata>=2024.1",
    "yfinance>=0.2.50",
]

[project.scripts]
parakh = "parakh.cli:main"

[project.optional-dependencies]
agents = [
    "claude-agent-sdk>=0.1",
]

[dependency-groups]
dev = [
    "pre-commit>=3.8",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
]
spikes = [
    "yfinance>=0.2.50",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parakh"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

ignore = ["E501"]  # the formatter wraps code; long strings and URLs are fine

[tool.ruff.lint.isort]
known-first-party = ["parakh", "tests", "tools"]

[tool.pyright]
include = ["src", "tests", "app", "tools", "run.py"]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "load: concurrent-execution tests (C5.5)",
    "ac(*ids): acceptance criteria this test proves (plan 14 §5; tools/traceability.py)",
]
