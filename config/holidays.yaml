# NSE equity trading holidays (plan 03 §3; AC-F11.1, AC-F12.5). Parakh jobs exit quietly on these days
# and take the last trading day of the previous month as the monthly as-of date.
# why: copied from NSE's own holiday-master API (segment CM) on 4 Oct 2026; two public websites
# disagreed on the Diwali date (9 vs 10 Nov), NSE's list says 10 Nov. Refresh with
# `parakh calendar sync` (prints a diff; changes go in through a PR like any config).
# NSE publishes next year's list in December: until then the calendar knows weekends only for
# that year, and `parakh doctor` and the Sunday heartbeat warn from 1 Dec (calendar gap).
source: "NSE holiday-master API, segment CM, fetched 2026-10-04"
# why: the Muhurat session is a symbolic hour with unrepresentative volume; it is not treated as
# a trading day for the watcher, and its bar is dropped from momentum inputs.
special_sessions_trade: false
years:
