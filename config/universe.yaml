# Stock universe (plan 05 §1). Everything is keyed on ISIN, never the ticker (plan 04 §4 #1).
# why mode=pilot: plan 09 §1 rollout step 1 (7 stocks) until M2; then cap, then all.
mode: pilot
# why: plan 13 D9, small caps are the Nifty Smallcap 250 only.
small_cap_index: NIFTY SMALLCAP 250

# Pilot (plan 13 D3). Cap buckets from the AMFI July 2026 list; ATHERENERG and SHADOWFAX are
# placed by market cap and confirmed from the AMFI file in Phase 1. Profiles per D24 (plan 01 §3).
# Golden test stocks per D18: the only pilots with 10+ years of listed history.
# ISINs checked against NSE quote pages on 29 Sep 2026; `parakh config validate` checks the
# ISO 6166 check digit. listed_on is the NSE listing date from EQUITY_L.csv (29 Sep 2026; D24);
# it bounds the price history of young listings.
pilot:
  - symbol: INDIGO
    isin: INE646L01027
    name: InterGlobe Aviation Ltd
    cap: large
    cap_source: AMFI Jul 2026
    profile: airline_lease_heavy
    listed_on: 2015-11-10
    golden: true
