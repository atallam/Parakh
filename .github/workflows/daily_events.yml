name: daily_events

# Mon-Fri 19:00 IST (13:30 UTC). Filings, insider trades, surveillance lists, deals.
on:
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

# one writer of the state branch at a time
concurrency:
  group: parakh-state
  cancel-in-progress: false

env:
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/parakh-job
        with:
          job-name: "Daily event watch"
          command: "events"
