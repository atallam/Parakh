name: monthly

# 2nd of every month, 09:30 IST (04:00 UTC): analyse the previous month-end, publish reports,
# send the summary (NFR-14: by 12:00 IST). The as-of date is the last trading day of last month.
on:
  schedule:
    - cron: "0 4 2 * *"
  workflow_dispatch:
    inputs:
      asof:
        description: "as-of date YYYY-MM-DD (default: last month-end)"
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: parakh-state
  cancel-in-progress: false

env:
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  # why: GitHub repository secrets are the recorded fallback to SSM (ADR-009); a name left unset
  # stays empty and the code treats it as "not configured"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/parakh-job
        with:
          job-name: "Monthly analysis"
          command: "run --mode monthly --notify ${{ inputs.asof && format('--asof {0}', inputs.asof) || '' }}"
          commit-reports: "true"
