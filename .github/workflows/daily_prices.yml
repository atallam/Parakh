name: daily_prices

# Mon-Fri 17:45 IST (12:15 UTC), after the NSE close and before the 18:30 IST daily watch. The watch only reads prices,
# so this job is what keeps them current (a holiday adds no new bar and is harmless).
on:
  schedule:
    - cron: "15 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

# one writer of the state branch at a time
concurrency:
  group: parakh-state
  cancel-in-progress: false

env:
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  # why: GitHub repository secrets are the recorded fallback to SSM (ADR-009); a name left unset
  # stays empty and the code treats it as "not configured"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  run:
    runs-on: ubuntu-latest
    # why: the first run after a universe stage change backfills 10 years per new stock at about 25 s each
    # (Mid = 147 stocks, about 1 hour); later daily runs take 3 to 5 minutes
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/parakh-job
        with:
          job-name: "Daily price load"
          command: "prices load --store supabase"
